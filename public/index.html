<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>摸魚王 · 線上房間</title>
<style>
  /* ===== 童話繪本風（storybook skin）：羊皮紙＋木框＋木牌按鈕；遊戲邏輯零更動 ===== */
  :root{--bg:#e3d3ab;--paper:#f4e9cd;--paper2:#eadbb4;--strip:#faf1da;--ink:#3a2a18;--muted:#8a7355;--line:#c2a473;--wood:#6b4423;--wood2:#4a2c14;--kraft:#8a5a30;--kraft2:#7a5a34;--red:#a83226;--green:#4a7040;--gold:#a5770b;--goldL:#d9a520;--blue:#4a6a8a;--purple:#6a5a8a;--panel:var(--paper)}
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);line-height:1.65;font-family:"Noto Serif TC","PMingLiU","MingLiU",Georgia,serif;
    background:radial-gradient(ellipse at 50% -10%,rgba(255,248,224,.7),transparent 55%),
      repeating-linear-gradient(0deg,rgba(120,90,40,.04) 0 2px,transparent 2px 5px),
      repeating-linear-gradient(90deg,rgba(120,90,40,.03) 0 3px,transparent 3px 7px),
      var(--bg)}
  .wrap{max-width:660px;margin:0 auto;padding:20px 14px 70px}
  h1{font-size:2rem;margin:8px 0 0;text-align:center;letter-spacing:8px;color:var(--wood2);text-shadow:0 1px 0 #fff8e0}
  h1::before{content:'❦  ';color:var(--goldL);font-size:.7em}h1::after{content:'  ❦';color:var(--goldL);font-size:.7em}
  .jp{text-align:center;color:var(--kraft);letter-spacing:5px;font-size:.8rem;margin-bottom:12px}
  .jp::after{content:'';display:block;width:180px;margin:8px auto 0;border-bottom:2px double var(--line)}
  .card{background:var(--paper);border:3px solid var(--wood);border-radius:6px;padding:12px 14px;margin:10px 0;position:relative;
    box-shadow:0 2px 10px rgba(74,44,20,.28),inset 0 0 0 1px #cdb27e,inset 0 0 46px rgba(160,120,60,.14)}
  h2{color:var(--kraft);font-size:1.05rem;margin:0 0 10px}
  label{display:block;font-size:.82rem;color:var(--muted);margin:10px 0 4px}
  input{width:100%;background:#fbf4e0;color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:11px 12px;font-size:1.05rem;font-family:inherit;box-shadow:inset 0 1px 3px rgba(120,90,40,.18)}
  /* 木牌按鈕 */
  button{background:linear-gradient(180deg,#96633a,#6b4423 55%,#5a3820);color:#f7ecd2;border:2px solid var(--wood2);border-radius:8px;padding:12px 16px;font-weight:800;cursor:pointer;font-family:inherit;font-size:1rem;width:100%;margin-top:10px;letter-spacing:1px;
    box-shadow:inset 0 1px 0 rgba(255,230,180,.4),inset 0 -2px 4px rgba(40,20,5,.3),0 2px 5px rgba(60,35,15,.35);text-shadow:0 1px 2px rgba(40,20,5,.55)}
  button:active{transform:translateY(1px)}
  /* 羊皮紙按鈕 */
  button.ghost{background:linear-gradient(180deg,#f7eed6,#e9dab2);color:var(--wood2);border:1.5px solid var(--kraft);text-shadow:none;box-shadow:inset 0 0 0 1px #fff6dc,0 1px 3px rgba(74,44,20,.22)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .code{font-family:ui-monospace,Consolas,monospace;font-size:1.8rem;letter-spacing:4px;color:var(--gold);text-align:center;font-weight:900;text-shadow:0 1px 0 #fff8e0}
  .plist{list-style:none;padding:0;margin:8px 0}
  .plist li{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;background:var(--strip)}
  .tag{font-size:.7rem;font-weight:800;padding:1px 8px;border-radius:99px;margin-left:6px}
  .t-boss{background:var(--red);color:#fff}.t-senior{background:var(--blue);color:#fff}.t-junior{background:var(--green);color:#fff}.t-host{background:var(--goldL);color:#3a2a10}
  .zones{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
  /* 木頭棋盤格（緊湊：手機一屏放完） */
  .zone{border:2px solid var(--kraft);border-radius:8px;padding:7px 6px;text-align:center;cursor:pointer;user-select:none;background:linear-gradient(180deg,#f3e9cc,#e7d7ad);box-shadow:0 1px 3px rgba(74,44,20,.2),inset 0 1px 0 #fff6dc}
  .zone.safe{border-color:var(--green)} .zone.work{border-color:var(--blue)}
  .zone.sel{outline:3px solid var(--goldL);background:#fdf3d0}
  .zone .ic{font-size:1.3rem}.zone .nm{font-weight:800}.zone .m{font-size:.74rem;color:var(--muted)}
  .me{display:flex;gap:12px;flex-wrap:wrap;font-size:.88rem;margin:2px 0;color:var(--muted);align-items:center}
  .me b{color:var(--ink)}
  .status{text-align:center;color:var(--gold);font-weight:900;margin:4px 0;font-size:1.1rem}
  .prep{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .prep span{background:var(--strip);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:.85rem;color:var(--ink)}
  /* 罩學弟：醒目大按鈕列 */
  .helpbar{border:2px solid var(--blue);background:#e9eff5;border-radius:8px;padding:8px 10px;margin:8px 0}
  .helpbar .hb-note{font-size:.75rem;color:var(--muted);margin-left:6px}
  .helpbar .hb-btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .helpbar .hb-btns button{flex:1;min-width:80px;margin:0;padding:10px 8px;font-size:.92rem;background:#f2f6fa;color:var(--blue);border:1.5px solid var(--blue);box-shadow:none;text-shadow:none;font-weight:800}
  .helpbar .hb-btns button.on{background:var(--blue);color:#fff}
  .timer{text-align:center;font-family:ui-monospace,Consolas,monospace;font-size:1.3rem;font-weight:900;color:var(--gold)}
  .timer.low{color:var(--red)}
  /* 魔法任務卷軸 */
  .task{background:linear-gradient(180deg,#fdf6df,#f1e4bc);border:1.5px solid var(--goldL);border-radius:4px;padding:10px 14px;margin:7px 0;position:relative;
    box-shadow:0 1px 4px rgba(74,44,20,.22),inset 0 0 20px rgba(217,165,32,.12)}
  .task::before,.task::after{content:'';position:absolute;left:-2px;right:-2px;height:7px;background:linear-gradient(180deg,#8a5a30,#6b4423);border-radius:99px;box-shadow:0 1px 2px rgba(60,35,15,.4)}
  .task::before{top:-5px}.task::after{bottom:-5px}
  .task .bar{height:10px;background:#e2d2a4;border-radius:6px;overflow:hidden;margin-top:6px;border:1px solid var(--line)}
  .task .fill{height:100%;background:linear-gradient(90deg,#e8c14a,#b8860b)}
  .log{font-size:.82rem;color:var(--muted);background:var(--strip);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:150px;overflow:auto}
  .log div{padding:2px 0;border-bottom:1px dashed #d8c496}
  .rev{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0;background:var(--strip)}
  .rev.caught{border-color:var(--red)} .rev.ok{border-color:var(--green)} .rev.out{opacity:.55}
  .banner{text-align:center;font-size:1.4rem;font-weight:900;color:var(--wood2);margin:10px 0;letter-spacing:2px}
  .theend{text-align:center;letter-spacing:6px;color:var(--muted);font-size:.85rem;margin:2px 0 6px}
  .theend::before,.theend::after{content:' ── ';color:var(--line)}
  .grade{display:inline-flex;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;font-weight:900;font-size:1.15rem;flex:0 0 auto;border:2px solid rgba(74,44,20,.35);box-shadow:0 1px 2px rgba(74,44,20,.3)}
  .g-S{background:var(--goldL);color:#3a2a10}.g-A{background:var(--green);color:#fff}.g-B{background:var(--blue);color:#fff}.g-C{background:#8a7a64;color:#fff}
  .ritem{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;background:var(--strip)}
  .ritem.king{border:2px solid var(--goldL);background:#fdf1c8;box-shadow:inset 0 0 18px rgba(217,165,32,.18)}
  .ritem .info{flex:1;min-width:0}.ritem .nm{font-weight:800}.ritem .ttl{font-size:.78rem;color:var(--muted)}
  .ritem .comp{font-family:ui-monospace,Consolas,monospace;font-weight:900;font-size:1.3rem;color:var(--gold);flex:0 0 auto}
  .bosscard{display:flex;align-items:center;gap:10px;border:1.5px solid var(--red);border-radius:8px;padding:10px 14px;margin:8px 0;background:#f8e8dc}
  .bosscard .info{flex:1}.bosscard .nm{font-weight:800}
  .hint{font-size:.8rem;color:var(--muted);text-align:center;margin-top:8px}
  .rules{background:var(--paper);border:3px solid var(--wood);border-radius:6px;padding:0 16px;margin:14px 0;box-shadow:0 2px 10px rgba(74,44,20,.28),inset 0 0 0 1px #cdb27e}
  .rules summary{cursor:pointer;font-weight:800;color:var(--kraft);padding:14px 0;font-size:1.05rem;list-style:none}
  .rules summary::-webkit-details-marker{display:none}
  .rules summary::before{content:'▸ ';color:var(--kraft2)}
  .rules[open] summary::before{content:'▾ '}
  .rules .body{padding-bottom:14px}
  .rules h4{color:var(--kraft2);margin:14px 0 4px;font-size:.95rem}
  .rules p{font-size:.9rem;margin:6px 0}.rules ul{margin:6px 0;padding-left:20px}.rules li{font-size:.88rem;margin:3px 0}
  .rules .win{border-left:3px solid var(--green);padding:2px 0 2px 10px;margin:6px 0;font-size:.9rem}
  .rules .win.boss{border-left-color:var(--red)} .rules .win b{color:var(--gold)}
  .rules .z{display:inline-block;font-size:.8rem;color:var(--muted)}
  .err{color:var(--red);text-align:center;font-weight:700;min-height:20px}
  /* 美術圖槽：public/art/ 放入對應檔名即自動顯示，缺圖自動收起 */
  .art{margin:10px 0;border:3px solid var(--wood);border-radius:6px;overflow:hidden;box-shadow:0 2px 10px rgba(74,44,20,.3),inset 0 0 0 1px #cdb27e;background:var(--paper2)}
  .art img{display:block;width:100%}
  /* ===== 手牌 ===== */
  .hand{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .hcard{border:1.5px solid var(--kraft);border-radius:6px;padding:6px 9px;font-size:.8rem;background:linear-gradient(180deg,#faf1da,#eee0ba);cursor:pointer;user-select:none;line-height:1.3;box-shadow:0 1px 2px rgba(74,44,20,.2)}
  .hcard .hn{font-weight:800}.hcard .hd{color:var(--muted);font-size:.7rem}
  .hcard.passive{cursor:default;border-style:dashed;opacity:.85}
  .hcard.sel{outline:2px solid var(--goldL);background:#fdf3d0}
  /* ===== 幽靈面板 ===== */
  .ghostbox{border:1.5px solid var(--purple);border-radius:8px;padding:10px;background:#efe9f4;margin:8px 0}
  .ghostbox .gb{display:flex;gap:6px;margin-top:6px}
  .ghostbox button{margin:0;font-size:.85rem;padding:9px 6px;background:#e2d9ec;color:#4a3a6a;border:1.5px solid var(--purple);box-shadow:none;text-shadow:none}
  .ghostbox button.on{background:var(--purple);color:#fff}
  /* ===== 動畫揭曉板 ===== */
  .board{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .bzone{border:2px solid var(--kraft);border-radius:8px;min-height:86px;padding:6px 8px;background:linear-gradient(180deg,#f3e9cc,#ecdfba);position:relative;transition:box-shadow .3s,border-color .3s;overflow:hidden}
  .bzone.office{grid-column:1/3;min-height:70px;border-color:var(--green)}
  .bzone .bt{font-size:.78rem;color:var(--muted);font-weight:800}
  .bzone.inspected{border-color:var(--red);box-shadow:0 0 14px rgba(168,50,38,.5);animation:pulseR 1s ease-in-out 2}
  .bzone .stamp{position:absolute;top:4px;right:6px;font-size:1.4rem;opacity:0;transform:scale(2.2);transition:all .35s cubic-bezier(.2,1.6,.4,1)}
  .bzone .stamp.in{opacity:1;transform:scale(1)}
  @keyframes pulseR{0%,100%{background:#f3e9cc}50%{background:#f2d3c4}}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .chip{display:inline-flex;align-items:center;gap:3px;background:var(--strip);border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:.8rem;font-weight:700;opacity:0;transform:translateY(14px) scale(.6);transition:all .4s cubic-bezier(.2,1.4,.4,1);position:relative}
  .chip.in{opacity:1;transform:none}
  .chip.caught{animation:shake .5s ease-in-out 2;border-color:var(--red);background:#f8ddd2}
  .chip.safe2{border-color:var(--green)}
  .chip.dead{opacity:.45;filter:grayscale(1)}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-3deg)}40%{transform:translateX(5px) rotate(3deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .float{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-size:.82rem;font-weight:900;pointer-events:none;opacity:0;white-space:nowrap;z-index:5}
  .float.go{animation:floatUp 1.6s ease-out forwards}
  .float.gold{color:var(--gold)}.float.red{color:var(--red)}.float.blue{color:var(--blue)}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,4px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
  .toast{border:1px solid var(--purple);background:#efe9f4;color:#4a3a6a;border-radius:6px;padding:6px 10px;font-size:.85rem;margin:5px 0;opacity:0;transform:translateX(-16px);transition:all .4s ease}
  .toast.in{opacity:1;transform:none}
  .sumline{display:flex;align-items:center;gap:6px;font-size:.92rem;padding:5px 8px;border-radius:6px;background:var(--strip);margin:3px 0;opacity:0;transition:opacity .4s}
  .sumline.in{opacity:1}
  .sumline .sn{font-weight:800;flex:0 0 auto}.sumline .si{margin-left:auto;font-weight:900;flex:0 0 auto}
  .si.gold{color:var(--gold)}.si.red{color:var(--red)}.si.mut{color:var(--muted)}
  .seg{display:flex;gap:6px;margin:4px 0}
  .seg button{flex:1;margin:0;font-size:.82rem;padding:8px;background:linear-gradient(180deg,#f5ecd4,#e8d9b2);color:var(--muted);border:1.5px solid var(--line);font-weight:600;box-shadow:none;text-shadow:none}
  .seg button.on{background:var(--goldL);color:#3a2a10;border-color:#b8860b;font-weight:900}
  .hide{display:none}
  .voicebar{position:fixed;left:0;right:0;bottom:0;background:#ecdfbc;border-top:2px solid var(--wood);padding:8px 12px;display:flex;gap:10px;align-items:center;justify-content:center;z-index:50;box-shadow:0 -2px 8px rgba(74,44,20,.2)}
  .voicebar button{width:auto;margin:0;padding:8px 14px;font-size:.9rem}
  .voicebar .vi{font-size:.82rem;color:var(--muted)}
  .voicebar .mute{background:linear-gradient(180deg,#f5ecd4,#e8d9b2);color:var(--kraft);border:1.5px solid var(--kraft);text-shadow:none}
</style>
</head>
<body>
<div class="wrap">
  <div id="hdr"><h1>摸魚王</h1><div class="jp">サボり王 · 線上房間</div></div>
  <div class="err" id="err"></div>

  <div id="s-home">
    <div class="art" id="art-home" style="display:none"><img src="art/01_cover.jpg" onload="$('art-home').style.display=''" onerror="$('art-home').remove()"></div>
    <div class="card">
      <h2>加入遊戲</h2>
      <label>你的暱稱</label><input id="name" maxlength="12" placeholder="輸入暱稱">
      <div class="row2">
        <div><label>房名（選填）</label><input id="roomname" maxlength="16" placeholder="週五摸魚團"></div>
        <div><label>密碼（選填＝上鎖）</label><input id="roompwd" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="4 位數字"></div>
      </div>
      <button onclick="doCreate()">開新房間（當房主）</button>
      <div class="row2" style="margin-top:12px">
        <input id="joincode" maxlength="4" placeholder="房間代碼" style="text-transform:uppercase">
        <button class="ghost" onclick="doJoin()" style="margin-top:0">加入房間</button>
      </div>
      <div style="margin-top:12px">
        <label>🤖 單人練習 — 總人數（你＋AI 同事＋AI 老闆）</label>
        <div class="seg" id="solocount">
          <button data-v="3" onclick="setSeg('solocount',this)">3 人</button>
          <button data-v="4" class="on" onclick="setSeg('solocount',this)">4 人</button>
          <button data-v="5" onclick="setSeg('solocount',this)">5 人</button>
          <button data-v="6" onclick="setSeg('solocount',this)">6 人</button>
        </div>
        <button class="ghost" onclick="doSolo()">🤖 開始單人練習</button>
      </div>
    </div>
    <div class="card">
      <h2>公開房間 <span id="roomcount" style="color:var(--muted);font-size:.8rem;font-weight:400"></span></h2>
      <ul class="plist" id="roomlist"><li style="color:var(--muted)">載入中…</li></ul>
      <button class="ghost" onclick="refreshRooms()">🔄 重新整理</button>
    </div>
    <div class="hint">3～6 人。老闆派工作、員工邊做邊摸。撐到下班、摸魚最多的當摸魚王。</div>
    <div id="rules-home"></div>
  </div>

  <div id="s-lobby" class="hide">
    <div class="art" id="art-lobby" style="display:none"><img src="art/02_lobby.jpg" onload="$('art-lobby').style.display=''" onerror="$('art-lobby').remove()"></div>
    <div class="card"><h2>房間代碼 <span id="lobbyname" style="color:var(--muted);font-size:.85rem;font-weight:400"></span></h2><div class="code" id="roomcode">----</div>
      <div class="hint">把這代碼給朋友加入，或直接分享連結（點了免輸房號密碼）。</div>
      <div class="row2">
        <button class="ghost" onclick="copyInvite()" style="margin-top:10px">🔗 複製邀請連結</button>
        <button class="ghost" onclick="showQR()" style="margin-top:10px">📱 顯示 QR Code</button>
      </div></div>
    <div class="card">
      <h2>玩家 <span id="pcount"></span></h2>
      <ul class="plist" id="lobbylist"></ul>
      <div id="hostpanel" class="hide">
        <label>老闆由誰當？</label>
        <div class="seg" id="bossmode"><button data-v="host" class="on" onclick="setSeg('bossmode',this)">我當老闆</button><button data-v="random" onclick="setSeg('bossmode',this)">隨機抽</button></div>
        <label>職級（老鳥/菜鳥）</label>
        <div class="seg" id="senmode"><button data-v="balanced" class="on" onclick="setSeg('senmode',this)">平均分</button><button data-v="random" onclick="setSeg('senmode',this)">隨機抽</button></div>
        <label>老闆業績門檻（完成率）</label>
        <div class="seg" id="threshold"><button data-v="low" onclick="setSeg('threshold',this)">六成(歡樂)</button><button data-v="mid" class="on" onclick="setSeg('threshold',this)">七成(標準)</button><button data-v="high" onclick="setSeg('threshold',this)">八成(硬派)</button></div>
        <label>房間密碼（輸入新密碼更新；留空＝解除鎖定）</label>
        <div class="row2">
          <input id="newpwd" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="4 位數字或留空">
          <button class="ghost" style="margin-top:0" onclick="setPwd()">🔑 更新密碼</button>
        </div>
        <button onclick="doStart()">開始遊戲</button>
        <button class="ghost" style="color:#a83226;border-color:#a83226" onclick="closeRoom()">🚪 關閉房間（釋出名額）</button>
      </div>
      <div id="waithost" class="hint hide">等房主開始遊戲…</div>
    </div>
    <div id="rules-lobby"></div>
  </div>

  <div id="s-game" class="hide">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="margin:0">第 <span id="round"></span>/<span id="rounds"></span> 回合</h2>
        <span id="myrole"></span>
      </div>
      <div class="me" id="mystats"></div>
      <div class="timer hide" id="timer"></div>
      <div class="status" id="status"></div>
      <div id="patternbox"></div>
      <div id="mytask"></div>

      <!-- 老闆行政 -->
      <div id="admin" class="hide">
        <div id="adminboss" class="hide">
          <div class="hint" id="adminhint"></div>
          <div style="font-size:.82rem;color:var(--kraft2);margin:6px 0 2px">派任務</div>
          <ul class="plist" id="assignlist"></ul>
          <div id="promotebox"></div>
          <div id="firebox"></div>
          <button onclick="sock.emit('beginRound')">進入本回合 ▶</button>
        </div>
        <div id="adminwait" class="hint hide"></div>
      </div>

      <!-- 員工選動作（兩段式：點選＝高亮，按確定才送出） -->
      <div id="empchoose" class="hide">
        <div id="helpbox"></div>
        <div id="handbox"></div>
        <div class="zones" id="empzones"></div>
        <button id="empsubmit" onclick="submitEmp()">選好後按我送出</button>
      </div>
      <!-- 幽靈作祟 -->
      <div id="ghostchoose" class="hide"></div>
      <!-- 主管協查 -->
      <div id="supchoose" class="hide">
        <div class="hint" id="suphint"></div>
        <div class="zones" id="supzones"></div>
        <button id="supsubmit" onclick="submitSup()">確定</button>
      </div>
      <!-- 老闆選查 -->
      <div id="bosschoose" class="hide">
        <div class="hint" id="bosshint"></div>
        <div class="zones" id="bosszones"></div>
        <button id="bosssubmit" onclick="submitBoss()">確定巡這些地方</button>
      </div>

      <!-- 揭曉（動畫過場） -->
      <div id="reveal" class="hide">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 id="revtitle" style="margin:0"></h2>
          <button class="ghost" onclick="skipReveal()" style="width:auto;margin:0;padding:5px 12px;font-size:.8rem">⏩ 跳過動畫</button>
        </div>
        <div id="revtoasts"></div>
        <div class="board" id="revboard"></div>
        <div id="revsum"></div>
        <details style="margin-top:6px"><summary style="cursor:pointer;font-size:.8rem;color:var(--muted)">📄 詳細文字</summary><div id="revlist"></div></details>
        <button id="nextbtn" class="hide" onclick="sock.emit('nextRound')">下一回合 ▶</button>
        <div id="waitnext" class="hint hide">等房主進入下一回合…</div>
      </div>
    </div>
    <details class="rules"><summary>📜 對局紀錄</summary><div class="body"><div class="log" id="log"></div></div></details>
  </div>

  <div id="s-spec" class="hide">
    <div class="card">
      <h2>👀 觀戰中 <span id="specname" style="color:var(--muted);font-size:.85rem;font-weight:400"></span></h2>
      <div class="hint" id="specmeta"></div>
      <div class="log" id="speclog" style="max-height:340px;margin-top:8px"></div>
      <button class="ghost" onclick="leaveSpec()">離開觀戰</button>
    </div>
  </div>

  <div id="s-end" class="hide">
    <div class="art" id="art-end" style="display:none"><img id="art-end-img" onload="$('art-end').style.display=''" onerror="$('art-end').style.display='none'"></div>
    <div class="card">
      <div class="theend">📖 THE END</div>
      <div class="banner" id="endbanner"></div>
      <div class="hint" id="endreason"></div>
      <div class="hint" id="endrate"></div>
      <ul class="plist" id="ranking"></ul>
      <div id="hostend" class="hide"><button onclick="sock.emit('restart')">再玩一局</button>
        <button class="ghost" style="color:#a83226;border-color:#a83226" onclick="closeRoom()">🚪 關閉房間（釋出名額）</button></div>
    </div>
  </div>
</div>

<div id="qrmodal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:99;align-items:center;justify-content:center" onclick="hideQR()">
  <div class="card" style="width:min(360px,92vw);text-align:center" onclick="event.stopPropagation()">
    <h2>📱 掃碼直接進房</h2>
    <div style="background:#fff;border-radius:10px;padding:10px;display:inline-block"><img id="qrimg" alt="QR Code" style="display:block;width:min(280px,70vw)"></div>
    <div class="hint" id="qrhint"></div>
    <button class="ghost" onclick="hideQR()">關閉</button>
  </div>
</div>

<div id="pwdmodal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99;align-items:center;justify-content:center">
  <div class="card" style="width:min(320px,90vw)">
    <h2>🔒 這間房有上鎖</h2>
    <input id="pwdinput" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="輸入 4 位數密碼">
    <button onclick="pwdOk()">加入</button>
    <button class="ghost" onclick="pwdCancel()">取消</button>
  </div>
</div>

<div id="voicebar" class="voicebar hide">
  <button id="voicebtn" onclick="toggleVoice()">🎤 開語音</button>
  <button id="mutebtn" class="mute hide" onclick="toggleMute()">🔇 靜音</button>
  <span class="vi" id="voiceinfo"></span>
</div>
<div id="audios" style="display:none"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const sock=io(); let ST=null, bossPicks=[], timerIv=null, supPick=null, helpTarget=null, selCard=null, ghostMode=null, empPick=null;
const seg={bossmode:'host',senmode:'balanced',threshold:'mid',solocount:'4'};
function $(id){return document.getElementById(id)}
function show(id){['s-home','s-lobby','s-game','s-end','s-spec'].forEach(s=>$(s).classList.toggle('hide',s!==id))}
function err(m){$('err').textContent=m||''; if(m)setTimeout(()=>{if($('err').textContent===m)$('err').textContent=''},4000);}
function setSeg(g,btn){seg[g]=btn.dataset.v;[...btn.parentNode.children].forEach(b=>b.classList.toggle('on',b===btn));}
let myPwd=null; // 開房/成功加入時記住密碼，供邀請連結使用
function saveName(n){try{localStorage.setItem('moyu_name',n);}catch(e){}}
// 斷線重連 session：房號＋playerId 存 localStorage，socket 重連或頁面重載都能綁回原座位
function saveSess(code,pid){try{localStorage.setItem('moyu_sess',JSON.stringify({code,pid}));}catch(e){}}
function clearSess(){try{localStorage.removeItem('moyu_sess');}catch(e){}}
function loadSess(){try{return JSON.parse(localStorage.getItem('moyu_sess')||'null');}catch(e){return null;}}
function doCreate(){const n=$('name').value.trim();if(!n)return err('請先輸入暱稱');
  const pwd=$('roompwd').value.trim();
  if(pwd&&!/^\d{4}$/.test(pwd))return err('房間密碼須為 4 位數字');
  sock.emit('createRoom',{name:n,roomName:$('roomname').value.trim(),password:pwd},r=>{if(r.error)return err(r.error);saveName(n);myPwd=pwd||null;saveSess(r.code,r.playerId);});}
function doSolo(){const n=$('name').value.trim();if(!n)return err('請先輸入暱稱');
  sock.emit('createSolo',{name:n,players:parseInt(seg.solocount)||4},r=>{if(r&&r.error)return err(r.error);saveName(n);myPwd=null;saveSess(r.code,r.playerId);});}
function joinWith(code,password){const n=$('name').value.trim();if(!n)return err('請輸入暱稱');
  sock.emit('joinRoom',{name:n,code,password},r=>{
    if(r&&r.needPassword){err(r.error);askPwd(code,'join');return;}
    if(r&&r.canSpectate){if(confirm(r.error+'\n要改用觀戰模式嗎？（只能看文字戰況）'))spectate(code,password);return;}
    if(r&&r.error)return err(r.error);
    saveName(n);myPwd=password||null;saveSess(r.code,r.playerId);});}
function doJoin(code,locked){code=((code||$('joincode').value.trim())+'').toUpperCase();
  if(!code)return err('請輸入代碼');
  if(!$('name').value.trim())return err('請輸入暱稱');
  if(code===inviteRoom&&inviteKey){joinWith(code,inviteKey);return;}
  if(locked){askPwd(code,'join');return;}
  joinWith(code);}
let pwdCtx=null;
function askPwd(code,mode){pwdCtx={code,mode:mode||'join'};$('pwdinput').value='';$('pwdmodal').style.display='flex';setTimeout(()=>$('pwdinput').focus(),60);}
function pwdCancel(){pwdCtx=null;$('pwdmodal').style.display='none';}
function pwdOk(){const p=$('pwdinput').value.trim();if(!/^\d{4}$/.test(p))return err('密碼是 4 位數字');const c=pwdCtx;pwdCancel();if(!c)return;
  if(c.mode==='spec')spectate(c.code,p);else joinWith(c.code,p);}
function spectate(code,password){sock.emit('spectateRoom',{code,password},r=>{
  if(r&&r.needPassword){err(r.error);askPwd(code,'spec');return;}
  if(r&&r.error)return err(r.error);});}
let SPEC=null;
sock.on('spec',d=>{SPEC=d;renderSpec();});
function renderSpec(){if(!SPEC)return;show('s-spec');
  $('specname').textContent=SPEC.name?('🏷 '+SPEC.name):SPEC.code;
  $('specmeta').textContent=(SPEC.phase==='lobby'?'等待開始':SPEC.phase==='ended'?'已結束':('第 '+SPEC.round+'/'+SPEC.rounds+' 回合'))+' · '+SPEC.players+' 位玩家';
  $('speclog').innerHTML=(SPEC.log||[]).map(l=>`<div>${esc(l)}</div>`).join('');$('speclog').scrollTop=9e9;}
function leaveSpec(){sock.emit('specLeave');SPEC=null;show('s-home');refreshRooms();}
function inviteURL(){return location.origin+location.pathname+'?room='+ST.code+(myPwd?('&key='+myPwd):'');}
function copyInvite(){if(!ST)return;
  const u=inviteURL();
  const p=(navigator.clipboard&&navigator.clipboard.writeText)?navigator.clipboard.writeText(u):Promise.reject();
  p.then(()=>err('已複製邀請連結 ✅')).catch(()=>prompt('手動複製這個連結分享：',u));}
function showQR(){if(!ST)return;
  sock.emit('makeQR',{text:inviteURL()},r=>{
    if(!r||r.error)return err((r&&r.error)||'QR Code 產生失敗');
    $('qrimg').src=r.dataUrl;
    $('qrhint').textContent='房間 '+ST.code+(myPwd?'（含密碼，掃了直接進）':'');
    $('qrmodal').style.display='flex';});}
function hideQR(){$('qrmodal').style.display='none';}
function closeRoom(){if(!confirm('確定關閉房間？所有人都會被請出。'))return;
  sock.emit('closeRoom',r=>{if(r&&r.error)err(r.error);});}
function setPwd(){const p=$('newpwd').value.trim();
  if(p&&!/^\d{4}$/.test(p))return err('密碼須為 4 位數字（留空＝解除鎖定）');
  sock.emit('setPassword',{password:p},r=>{if(r&&r.error)return err(r.error);
    myPwd=p||null;err(p?'密碼已更新 ✅（邀請連結/QR 已同步新密碼）':'已解除鎖定 ✅');});}
function refreshRooms(){
  sock.emit('listRooms',res=>{
    if(!res||!res.ok)return;
    $('roomcount').textContent=`（${res.count}/${res.max} 間）`;
    $('roomlist').innerHTML=res.rooms.length?res.rooms.map(r=>
      `<li><span>${r.locked?'🔒 ':''}${esc(r.name)} <span style="color:var(--muted);font-size:.8rem">${r.players}/${r.max} · ${r.inGame?'遊戲中':'等待中'}</span></span>`+
      (r.inGame||r.players>=r.max?'':`<button style="width:auto;margin:0;padding:6px 12px" onclick="doJoin('${r.code}',${r.locked})">加入</button>`)+`</li>`).join('')
      :'<li style="color:var(--muted)">目前沒有房間，開一間吧！</li>';
  });
}
sock.on('kicked',({reason})=>{ST=null;clearSess();show('s-home');err(reason||'房間已關閉');refreshRooms();});
setInterval(()=>{if(!ST)refreshRooms();},5000);
function doStart(){sock.emit('startGame',{bossMode:seg.bossmode,seniorityMode:seg.senmode,threshold:seg.threshold},r=>{if(r&&r.error)return err(r.error);});}
function submitBoss(){if(bossPicks.length!==ST.bossInspect)return err('請選 '+ST.bossInspect+' 個地方');sock.emit('submitChoice',{zones:bossPicks},r=>{if(r&&r.error)return err(r.error);});}
// 員工兩段式：pickEmp 只記選擇並高亮，submitEmp 才真正送出（送出後、大家都交齊前仍可改選重送）
function pickEmp(action,zone){empPick={action,zone:zone||null};renderEmpZones();}
function submitEmp(){
  if(!empPick)return err('先選這回合要去哪／做什麼');
  sock.emit('submitChoice',{action:empPick.action,zone:empPick.zone,helpTarget,cardIdx:selCard},r=>{if(r&&r.error)return err(r.error);});}
function ghostAct(type,targetId){ghostMode=null;sock.emit('submitChoice',{ghostAction:{type,targetId}},r=>{if(r&&r.error)return err(r.error);});}
function ghostWarnMenu(){ghostMode=ghostMode==='warn'?null:'warn';renderGhost();}
function toggleCard(i){selCard=(selCard===i)?null:i;renderEmpZones();}
const ZI={office:'🏢',tea:'☕',copy:'🖨️',toilet:'🚻',roof:'🪟'};

sock.on('state',s=>{ST=s;render();});

function roleTag(role,sen){if(role==='boss')return '<span class="tag t-boss">老闆</span>';if(sen==='senior')return '<span class="tag t-senior">老鳥</span>';if(sen==='junior')return '<span class="tag t-junior">菜鳥</span>';return '';}

function render(){
  $('voicebar').classList.toggle('hide', !ST);
  // 遊戲中收起大標題，把垂直空間讓給選擇區（手機一屏放完）
  $('hdr').classList.toggle('hide', !!(ST&&ST.phase!=='lobby'&&ST.phase!=='ended'));
  if(!ST){show('s-home');return}
  if(ST.phase==='lobby'){renderLobby();show('s-lobby');}
  else if(ST.phase==='ended'){renderEnd();show('s-end');}
  else {renderGame();show('s-game');}
  renderTimer(); $('log').innerHTML=(ST.log||[]).map(l=>`<div>${esc(l)}</div>`).join('');$('log').scrollTop=9e9;
}
function renderLobby(){
  $('roomcode').textContent=ST.code; $('lobbyname').textContent=ST.name?('🏷 '+ST.name):'';
  $('pcount').textContent='（'+ST.players.length+'/6）';
  $('lobbylist').innerHTML=ST.players.map(p=>`<li><span>${p.connected?'🟢':'⚪'} ${esc(p.name)} ${p.isHost?'<span class="tag t-host">房主</span>':''}</span></li>`).join('');
  const amHost=ST.you&&ST.you.isHost; $('hostpanel').classList.toggle('hide',!amHost); $('waithost').classList.toggle('hide',amHost);
}
function renderTimer(){
  if(timerIv){clearInterval(timerIv);timerIv=null;}
  const t=$('timer');
  if(ST.timerEndsAt&&(ST.phase==='choosing'||ST.phase==='admin'||ST.phase==='reveal')){
    t.classList.remove('hide');
    const upd=()=>{
      const s=Math.max(0,Math.round((ST.timerEndsAt-Date.now())/1000));
      if(ST.phase==='reveal'){
        t.textContent='⏭ '+s+' 秒後自動進入下一回合';
        t.classList.remove('low');
        if(ST.you&&ST.you.isHost){ const nb=$('nextbtn'); const left=Math.ceil(((ST.revealSkipAt||0)-Date.now())/1000);
          if(left>0){ nb.disabled=true; nb.textContent='看結果中…（'+left+'）'; } else { nb.disabled=false; nb.textContent='下一回合 ▶'; } }
      } else { t.textContent='⏱ '+s+' 秒'; t.classList.toggle('low',s<=10); }
    };
    upd(); timerIv=setInterval(upd,500);
  } else t.classList.add('hide');
}
function renderGame(){
  $('round').textContent=ST.round;$('rounds').textContent=ST.rounds;
  const you=ST.you;
  $('myrole').innerHTML = you.isSupervisor ? `<span class="tag" style="background:#a06ea0;color:#fff">主管 ${you.supTermLeft}回</span>` : roleTag(you.role,you.seniority);
  if(you.role==='emp'){
    // 圖示化：心悸＝愛心格（一眼看離出局多遠），文字降到最少
    const a=Math.min(you.anxiety,ST.anxietyOut), anxHot=you.anxiety>=ST.anxietyOut-1;
    const pips='💓'.repeat(a)+'🤍'.repeat(Math.max(0,ST.anxietyOut-a));
    $('mystats').innerHTML=`<b style="font-size:1.15rem;letter-spacing:1px">${pips}</b>${anxHot&&you.alive?' <b style="color:#a83226">⚠️</b>':''}　🐟<b>${you.slackCount}</b>　<span style="opacity:.7">💰${you.points}</span>${you.canBeFired?' <span class="tag t-boss">逾期</span>':''}${you.alive?'':' <b style="color:#a83226">👻</b>'}`;
  } else {
    $('mystats').innerHTML=`存活員工 <b>${ST.players.filter(p=>p.role==='emp'&&p.alive).length}</b>　任務完成 <b>${ST.tasksDone}/${ST.tasksIssued}</b>（門檻 ${Math.round(ST.completeThreshold*100)}%）${ST.supervisorName?'　主管:'+esc(ST.supervisorName):''}`;
  }
  // 老闆行為模式卡（bot 老闆專屬）：一行圖示化
  $('patternbox').innerHTML = (ST.bossPattern&&you.role==='emp')
    ? `<div class="task" style="border-color:var(--purple);padding:7px 14px">📇 <b>${esc(ST.bossPattern.name)}</b>　<span style="font-size:.82rem;color:var(--muted)">${esc(ST.bossPattern.hint)}</span></div>` : '';
  const mt=$('mytask');
  if(you.role==='emp'&&you.task){const t=you.task;mt.innerHTML=`<div class="task" style="padding:7px 14px">📋 <b>${esc(t.name)}</b>${t.state==='grace'?' <span class="tag t-boss">補交⚠️</span>':''}　<span style="font-size:.85rem">${t.progress}/${t.need}｜⏳${t.deadlineLeft}回</span><div class="bar"><div class="fill" style="width:${Math.min(100,t.progress/t.need*100)}%"></div></div></div>`;}
  else mt.innerHTML='';

  ['admin','empchoose','supchoose','bosschoose','ghostchoose','reveal'].forEach(x=>$(x).classList.add('hide'));

  if(ST.phase==='admin'){
    $('admin').classList.remove('hide');
    const amBoss=you.role==='boss';
    $('adminboss').classList.toggle('hide',!amBoss); $('adminwait').classList.toggle('hide',amBoss);
    if(amBoss){
      $('adminhint').textContent=`任務卡剩 ${ST.admin.taskLeft}。派工作／升職／資遣後按「進入本回合」。`;
      $('assignlist').innerHTML=ST.admin.needTask.length?ST.admin.needTask.map(p=>`<li><span>${esc(p.name)}</span><button style="width:auto;margin:0;padding:6px 12px" onclick="sock.emit('assignTask',{targetId:'${p.id}'})">派任務</button></li>`).join(''):'<li style="color:var(--muted)">所有員工都有任務了</li>';
      renderPromoteFire();
    } else {
      // 員工備戰列：圖示徽章一行看完，不寫句子
      const lz=you.lastZone&&you.lastZone!=='office'?ST.zones[you.lastZone].name:null;
      const gap=ST.anxietyOut-you.anxiety;
      $('adminwait').innerHTML='👔 老闆在派工作…'
        +'<div class="prep">'
        +(lz?`<span>🚫 ${lz}</span>`:'')
        +`<span style="${gap<=2?'color:#a83226;font-weight:800':''}">💓 剩 ${gap} 格</span>`
        +(you.task?`<span${you.task.state==='grace'?' style="color:#a83226;font-weight:800"':''}>📋 ${you.task.progress}/${you.task.need}·剩${you.task.deadlineLeft}回${you.task.state==='grace'?'⚠️':''}</span>`:'')
        +(you.hand&&you.hand.length?`<span>🃏 ${you.hand.map(c=>c.icon).join('')}</span>`:'')
        +'</div>';
    }
    $('status').textContent='';
  } else if(ST.phase==='choosing'){
    const waiting=ST.players.filter(p=>!p.submitted&&p.alive).length;
    $('status').textContent=you.submitted?`✅ 已送出，等 ${waiting} 人…`
      :(you.role==='boss'?'😼 你要巡哪裡？':(you.isSupervisor?'🕵️ 要不要協查？':'🤫 這回合你要去哪？'));
    if(!you.alive){
      if(you.isGhost){renderGhost();$('ghostchoose').classList.remove('hide');$('status').textContent='你是幽靈 👻 可作祟攪局';}
      else $('status').textContent='觀戰中…';
      return;}
    if(you.role==='boss'){renderBossZones();$('bosschoose').classList.remove('hide');$('bosssubmit').disabled=you.submitted;$('bosshint').textContent='選 '+ST.bossInspect+' 個要巡查的地方';}
    else if(you.isSupervisor){renderSupZones();$('supchoose').classList.remove('hide');}
    else {renderEmpZones();$('empchoose').classList.remove('hide');}
  } else if(ST.phase==='reveal'){
    renderReveal();$('reveal').classList.remove('hide');
    const amHost=you.isHost;$('nextbtn').classList.toggle('hide',!amHost);$('waitnext').classList.toggle('hide',amHost);$('status').textContent='';
  }
}
function renderPromoteFire(){
  const a=ST.admin;
  if(a.supervisorName) $('promotebox').innerHTML=`<div style="font-size:.82rem;color:#6a4a8a;margin:8px 0 2px">主管：${esc(a.supervisorName)}（任期中）</div>`;
  else if(a.canPromote&&a.promotable.length) $('promotebox').innerHTML=`<div style="font-size:.82rem;color:#6a4a8a;margin:8px 0 2px">升職令（升為主管：不能摸魚、免疫被抓、可協查抓人 +2）</div><ul class="plist">`+a.promotable.map(p=>`<li><span>${esc(p.name)}</span><button style="width:auto;margin:0;padding:6px 12px;background:#a06ea0;color:#fff" onclick="sock.emit('promote',{targetId:'${p.id}'})">升職</button></li>`).join('')+`</ul>`;
  else $('promotebox').innerHTML=`<div class="hint" style="text-align:left">升職令冷卻中</div>`;
  if(a.fireable.length&&a.bossFires>0) $('firebox').innerHTML=`<div style="font-size:.82rem;color:#a83226;margin:8px 0 2px">資遣（剩 ${a.bossFires} 次；限有逾期紀錄者）</div><ul class="plist">`+a.fireable.map(p=>`<li><span>${esc(p.name)}</span><button style="width:auto;margin:0;padding:6px 12px;background:var(--red);color:#fff" onclick="if(confirm('確定資遣 ${esc(p.name)}？'))sock.emit('fire',{targetId:'${p.id}'})">資遣</button></li>`).join('')+`</ul>`;
  else $('firebox').innerHTML='';
}
function renderSupZones(){
  const sub=ST.you.submitted;
  $('suphint').innerHTML='你是<b>主管</b>：不能摸魚、免疫被抓。可協查一個區抓摸魚同事（抓到 +2 分），或不協查。';
  const cells=[`<div class="zone safe ${supPick===null?'sel':''}" onclick="${sub?'':'pickSup(null)'}"><div class="ic">🙈</div><div class="nm">不協查</div></div>`];

}

// ===== 語音（WebRTC P2P mesh；信令走 socket）=====
let localStream=null, vpeers={}, voiceActive=false, muted=false;
const VOICE_URL='https://'+location.hostname+':8443';
const RTC_CFG={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
function voiceSupported(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.RTCPeerConnection); }
async function toggleVoice(){
  if(voiceActive){ stopVoice(); return; }
  if(!voiceSupported()){ alert('這個連線不能開麥克風（瀏覽器限制）。\n請改用語音專用網址：\n'+VOICE_URL+'\n（第一次會出現憑證警告，點「進階→繼續前往」即可）'); return; }
  try{ localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false}); }
  catch(e){ alert('無法取得麥克風：'+(e&&e.message||e)); return; }
  voiceActive=true; muted=false;
  $('voicebtn').textContent='📴 關語音'; $('mutebtn').classList.remove('hide'); $('mutebtn').textContent='🔇 靜音';
  sock.emit('voice-join'); updateVoiceInfo();
}
function stopVoice(){
  voiceActive=false; sock.emit('voice-leave');
  for(const id in vpeers){ try{vpeers[id].close();}catch(e){} const a=$('a_'+id); if(a)a.remove(); } vpeers={};
  if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; }
  $('voicebtn').textContent='🎤 開語音'; $('mutebtn').classList.add('hide'); updateVoiceInfo();
}
function toggleMute(){ if(!localStream)return; muted=!muted; localStream.getAudioTracks().forEach(t=>t.enabled=!muted); $('mutebtn').textContent=muted?'🎙 取消靜音':'🔇 靜音'; }
function vMakePeer(id, initiator){
  const pc=new RTCPeerConnection(RTC_CFG);
  if(localStream) localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  pc.onicecandidate=e=>{ if(e.candidate) sock.emit('voice-signal',{to:id,data:{ice:e.candidate}}); };
  pc.ontrack=e=>{ let a=$('a_'+id); if(!a){ a=document.createElement('audio'); a.id='a_'+id; a.autoplay=true; a.playsInline=true; $('audios').appendChild(a); } a.srcObject=e.streams[0]; a.play&&a.play().catch(()=>{}); };
  vpeers[id]=pc;
  if(initiator){ pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>sock.emit('voice-signal',{to:id,data:{sdp:pc.localDescription}})).catch(()=>{}); }
  return pc;
}
sock.on('voice-peers', list=>{ (list||[]).forEach(p=>vMakePeer(p.id,true)); updateVoiceInfo(); });
sock.on('voice-joined', ()=>{ updateVoiceInfo(); });     // 對方會主動 offer，我們等 offer
sock.on('voice-signal', async ({from,data})=>{
  if(!voiceActive) return;
  let pc=vpeers[from]; if(!pc){ pc=vMakePeer(from,false); }
  try{
    if(data.sdp){ await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      if(data.sdp.type==='offer'){ const ans=await pc.createAnswer(); await pc.setLocalDescription(ans); sock.emit('voice-signal',{to:from,data:{sdp:pc.localDescription}}); } }
    else if(data.ice){ await pc.addIceCandidate(new RTCIceCandidate(data.ice)); }
  }catch(e){}
});
sock.on('voice-left', ({id})=>{ if(vpeers[id]){ try{vpeers[id].close();}catch(e){} delete vpeers[id]; } const a=$('a_'+id); if(a)a.remove(); updateVoiceInfo(); });
function updateVoiceInfo(){ $('voiceinfo').textContent = voiceActive ? ('🔊 語音中（'+(Object.keys(vpeers).length+1)+' 人）') : (voiceSupported()?'':'語音需 '+VOICE_URL); }

show('s-home');
updateVoiceInfo();
refreshRooms();

// 同裝置記住暱稱：重新整理/中途離開再回來，暱稱欄自動帶回
const savedName=(function(){try{return localStorage.getItem('moyu_name')||'';}catch(e){return '';}})();
if(savedName)$('name').value=savedName;

// 邀請連結：?room=CODE&key=1234 → 免輸房號密碼；記得暱稱就直接自動進房
const _qp=new URLSearchParams(location.search);
const inviteRoom=(_qp.get('room')||'').toUpperCase();
const inviteKey=_qp.get('key')||undefined;
function tryInvite(){
  if(!inviteRoom)return;
  $('joincode').value=inviteRoom;
  if(savedName)joinWith(inviteRoom,inviteKey);
  else err('受邀加入房間 '+inviteRoom+'：輸入暱稱後按「加入房間」');
}
// 連線（含 socket.io 自動重連）：有 session 先嘗試綁回原座位，失敗才走邀請連結
let booted=false;
sock.on('connect',()=>{
  const s=loadSess();
  if(s&&s.code){
    sock.emit('rejoin',{code:s.code,playerId:s.pid},r=>{
      if(r&&r.ok){booted=true;return;}
      clearSess();
      if(!booted){booted=true;tryInvite();}
    });
  } else if(!booted){booted=true;tryInvite();}
});
</script>
